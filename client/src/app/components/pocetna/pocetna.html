<h1>Početna</h1>

@if (statistika(); as s) {
  <div class="kartice ukupno">
    <mat-card>
      <mat-card-content>
        <span class="broj">{{ s.projekti }}</span>
        <span class="naziv">Ukupno projekata</span>
      </mat-card-content>
    </mat-card>
    <mat-card>
      <mat-card-content>
        <span class="broj">{{ s.zadaci }}</span>
        <span class="naziv">Ukupno zadataka</span>
      </mat-card-content>
    </mat-card>
  </div>

  <h2>Zadaci po statusu</h2>
  <div class="kartice statusi">
    <mat-card>
      <mat-card-content>
        <span class="broj">{{ s.novo }}</span>
        <span class="naziv"><span class="tacka status-0"></span>Novo</span>
      </mat-card-content>
    </mat-card>
    <mat-card>
      <mat-card-content>
        <span class="broj">{{ s.uToku }}</span>
        <span class="naziv"><span class="tacka status-1"></span>U toku</span>
      </mat-card-content>
    </mat-card>
    <mat-card>
      <mat-card-content>
        <span class="broj">{{ s.zavrseno }}</span>
        <span class="naziv"><span class="tacka status-2"></span>Završeno</span>
      </mat-card-content>
    </mat-card>
  </div>
}
