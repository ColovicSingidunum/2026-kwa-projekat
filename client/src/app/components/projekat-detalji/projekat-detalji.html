<a matButton class="nazad" routerLink="/projekti">
  <mat-icon>arrow_back</mat-icon>
  Projekti
</a>

@if (projekat(); as p) {
  <h1>{{ p.naziv }}</h1>
  <mat-card class="projekat">
    <mat-card-header>
      <mat-card-subtitle>Rok: {{ p.rokRealizacije | date }}</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <p>{{ p.opis }}</p>
    </mat-card-content>
    <mat-card-actions align="end">
      <a matButton [routerLink]="['/projekti', p.id, 'izmena']">
        <mat-icon>edit</mat-icon>
        Izmeni
      </a>
      <button matButton class="opasno" (click)="obrisi()">
        <mat-icon>delete</mat-icon>
        Obriši
      </button>
    </mat-card-actions>
  </mat-card>

  @if (statistika(); as s) {
    <div class="kartice statistika">
      <mat-card>
        <mat-card-content>
          <span class="broj">{{ s.zadaci }}</span>
          <span class="naziv">Ukupno zadataka</span>
        </mat-card-content>
      </mat-card>
      <mat-card>
        <mat-card-content>
          <span class="broj">{{ s.novo }}</span>
          <span class="naziv"><span class="tacka status-0"></span>Novo</span>
        </mat-card-content>
      </mat-card>
      <mat-card>
        <mat-card-content>
          <span class="broj">{{ s.uToku }}</span>
          <span class="naziv"><span class="tacka status-1"></span>U toku</span>
        </mat-card-content>
      </mat-card>
      <mat-card>
        <mat-card-content>
          <span class="broj">{{ s.zavrseno }}</span>
          <span class="naziv"><span class="tacka status-2"></span>Završeno</span>
        </mat-card-content>
      </mat-card>
    </div>
  }

  <app-zadaci [projekatId]="p.id" (promena)="ucitajStatistiku()" />
}
