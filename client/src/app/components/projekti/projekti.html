<div class="zaglavlje">
  <h1>Projekti</h1>
  <a matButton="filled" routerLink="/projekti/novi">
    <mat-icon>add</mat-icon>
    Novi projekat
  </a>
</div>

@if (ucitava()) {
  <mat-progress-bar mode="indeterminate" />
}

@if (strana(); as s) {
  <div class="tabela">
    <table mat-table [dataSource]="s.sadrzaj">
      <ng-container matColumnDef="naziv">
        <th mat-header-cell *matHeaderCellDef>Naziv</th>
        <td mat-cell *matCellDef="let p">
          <a [routerLink]="['/projekti', p.id]">{{ p.naziv }}</a>
        </td>
      </ng-container>
      <ng-container matColumnDef="opis">
        <th mat-header-cell *matHeaderCellDef>Opis</th>
        <td mat-cell *matCellDef="let p" class="opis">{{ p.opis }}</td>
      </ng-container>
      <ng-container matColumnDef="rokRealizacije">
        <th mat-header-cell *matHeaderCellDef>Rok</th>
        <td mat-cell *matCellDef="let p">{{ p.rokRealizacije | date }}</td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="kolone"></tr>
      <tr mat-row *matRowDef="let p; columns: kolone"></tr>
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell prazno" [attr.colspan]="kolone.length">
          Nema projekata. <a routerLink="/projekti/novi">Napravi prvi projekat</a>.
        </td>
      </tr>
    </table>
  </div>
  <mat-paginator
    [length]="s.ukupno"
    [pageIndex]="s.broj"
    [pageSize]="s.velicina"
    [pageSizeOptions]="velicine"
    (page)="promeniStranu($event)"
  />
}
